<svg width="860" height="460" viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace">
  <defs>
    <clipPath id="round"><rect width="860" height="460" rx="12"/></clipPath>
