    <text x="188" y="256" fill="#cdd6f4" font-size="12">, </text>
    <text x="202" y="256" fill="#fab387" font-size="12">"Python"</text>
    <text x="274" y="256" fill="#cdd6f4" font-size="12">, </text>
    <text x="288" y="256" fill="#fab387" font-size="12">"Docker"</text>
    <text x="360" y="256" fill="#cdd6f4" font-size="12">,</text>

    <text x="16" y="276" fill="#4a4a6a" font-size="12">10</text>
    <text x="52" y="276" fill="#cdd6f4" font-size="12">],</text>

    <text x="16" y="296" fill="#4a4a6a" font-size="12">11</text>
    <text x="52" y="296" fill="#cdd6f4" font-size="12">learning</text>
    <text x="112" y="296" fill="#cdd6f4" font-size="12">: </text>
