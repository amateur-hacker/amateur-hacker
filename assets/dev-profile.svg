    <text x="474" y="274" fill="#cdd6f4" font-size="12"> open https://moodifyr.xyz</text>

    <text x="450" y="294" fill="#6c7086" font-size="12">launching browser...</text>

    <line x1="450" y1="308" x2="840" y2="308" stroke="#2a2a3d" stroke-width="1"/>

    <text x="450" y="328" fill="#a6e3a1" font-size="12">~$</text>
    <!-- blinking cursor block -->
